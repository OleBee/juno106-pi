# /etc/pipewire/pipewire.conf.d/50-pi5-hdmi-lyd.conf
# Fast 48 kHz-graf med liten, men HDMI-stabil quantum (nivå A).
# 256/48000 = 5,33 ms per syklus. Se README for nivå B/C hvis det knitrer.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 256
    default.clock.min-quantum   = 256
    default.clock.max-quantum   = 1024
}
