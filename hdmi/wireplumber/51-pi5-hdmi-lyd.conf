# /etc/wireplumber/wireplumber.conf.d/51-pi5-hdmi-lyd.conf  (WirePlumber 0.5+, Pi OS Trixie)
# HDMI0 primær, HDMI1 reserve, USB-lydkort valgfri reserve.
# Høyest priority.session vinner som standard utgang når den finnes.
monitor.alsa.rules = [
  {
    # HDMI0 – porten nærmest USB-C-strømmen
    matches = [
      { node.name = "~alsa_output.platform-107c701400.hdmi.*" }
      { alsa.card_name = "vc4-hdmi-0", media.class = "Audio/Sink" }
    ]
    actions = {
      update-props = {
        node.description              = "HDMI0 (primær, ved USB-C)"
        priority.session              = 2000
        priority.driver               = 2000
        audio.rate                    = 48000
        api.alsa.period-size          = 256    # nivå A (B: 512, C: 1024)
        api.alsa.headroom             = 256    # nivå A (B: 512, C: 1024)
        session.suspend-timeout-seconds = 0    # hold HDMI-lyden åpen: receivere/lydplanker
                                               # bruker ofte 0,5–2 s på å låse seg på nytt
      }
    }
  }
  {
    # HDMI1 – reserve
    matches = [
      { node.name = "~alsa_output.platform-107c706400.hdmi.*" }
      { alsa.card_name = "vc4-hdmi-1", media.class = "Audio/Sink" }
    ]
    actions = {
      update-props = {
        node.description              = "HDMI1 (reserve)"
        priority.session              = 1500
        priority.driver               = 1500
        audio.rate                    = 48000
        api.alsa.period-size          = 256
        api.alsa.headroom             = 256
        session.suspend-timeout-seconds = 0
      }
    }
  }
  {
    # Valgfritt USB-lydkort – lavere prioritet enn begge HDMI-portene
    matches = [ { node.name = "~alsa_output.usb-.*" } ]
    actions = {
      update-props = {
        priority.session     = 1000
        priority.driver      = 1000
        api.alsa.period-size = 128
        api.alsa.headroom    = 0
      }
    }
  }
]
