# /etc/alsa/conf.d/60-pi5-hdmi-lyd.conf
# Navngitte ALSA-enheter for programmer som snakker ALSA direkte (uten PipeWire).
# vc4-HDMI tar bare IEC958_SUBFRAME_LE; "hdmi:"-enheten (iec958-plugin) gjør
# konverteringen, og plug tar seg av format/rate. Ingen softvol = minst forsinkelse.

pcm.lyd_hdmi0 {
    type plug
    slave.pcm "hdmi:CARD=vc4hdmi0,DEV=0"
    hint.description "HDMI0 (primær, ved USB-C)"
}
pcm.lyd_hdmi1 {
    type plug
    slave.pcm "hdmi:CARD=vc4hdmi1,DEV=0"
    hint.description "HDMI1 (reserve)"
}
# Valgfritt USB-lydkort (første USB-kort ALSA finner heter ofte "Device"; se `aplay -l`)
pcm.lyd_usb {
    type plug
    slave.pcm "hw:CARD=Device,DEV=0"
    hint.description "USB-lydkort (valgfri reserve)"
}
