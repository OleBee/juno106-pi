# /etc/alsa/conf.d/61-ju6-dacplus.conf
# Navngitt ALSA-enhet for Raspberry Pi DAC+ (PCM5122), til feilsøking, f.eks.
#   speaker-test -D lyd_dacplus -c 2 -t sine
# ju6pi selv finner kortet etter navn («RPi DAC+», id RPiDAC) og bruker plughw direkte.
pcm.lyd_dacplus {
    type plug
    slave.pcm "hw:CARD=RPiDAC,DEV=0"
    hint.description "Raspberry Pi DAC+ (RCA linje ut / hodetelefon)"
}
