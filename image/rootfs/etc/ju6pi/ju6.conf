# JU-6 Pi – standardinnstillinger (skrivebeskyttet i imaget).
# Vil du endre noe: kopier linjen til ju6/ju6.conf på JU6DATA-partisjonen
# (synlig som en minnepinne når SD-kortet settes i en PC). Den filen overstyrer denne.

# ---------- Lyd ut ----------
# Rekkefølge å prøve: hdmi0 (porten nærmest USB-C-strømmen), hdmi1, usb (USB-lydkort), null (ingen lyd)
audio_devices = hdmi0 hdmi1 usb
# auto = minste stabile buffer, øker selv ved gjentatte underløp (lagres).  Eller fast, f.eks. 256x2
buffer = auto
sample_rate = 48000
# VCF-oversampling: auto (4x hvis CPU-en tåler det, ellers 2x), 2 eller 4
oversample = auto
# Kort lydsignal (to toner) når synthen er klar
chime = on
# Ekstra utgangsforsterkning i dB (negativ = lavere)
output_gain_db = 0
# Sanntid
rt_priority = 80
audio_cpu = 3

# ---------- Spilling ----------
voices = 6
# 1 = Poly I (106-standard), 2 = Poly II, 0 = Unison/mono
voice_mode = 1
# Anslag (velocity): off = som originalen
velocity = off
# Bender: 0..1 (0.25 ≈ ±2 halvtoner på DCO)
bender_dco = 0.25
bender_vcf = 0.0
# MOD-dybde (LFO til DCO når joystick/mod-hjul skyves)
mod_depth = 0.5
master_volume = 0.5
# Patch ved første oppstart (0 = A11). Senere huskes siste valgte patch.
start_patch = 0

# ---------- Kontroller (AKAI MPK Mini Plus, fabrikkoppsett) ----------
# Tangenter: omni = alle kanaler (unntatt pad-kanalen), eller 1–16
key_channel = omni
pad_channel = 10
knob_cc = 70 71 72 73 74 75 76 77
pad_notes_a = 36 37 38 39 40 41 42 43
pad_notes_b = 44 45 46 47 48 49 50 51
mod_cc = 1
# absolute (standard) eller relative (hvis knottene er satt til Relative i MPK-programmet)
knob_mode = absolute
# jump = verdien hopper til knotten; pickup = knotten må passere gjeldende verdi først
knob_takeover = jump
save_hold_seconds = 1.5
