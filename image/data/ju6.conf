# JU-6 Pi – dine innstillinger. Fjern # foran en linje for å bruke den.
# Fullstendig liste med forklaring: /etc/ju6pi/ju6.conf i imaget, og README i prosjektet.

# Lydutgang: auto (DAC+ hvis den sitter på, ellers HDMI0, HDMI1, USB), dacplus, hdmi, usb
#audio_output = auto
# Bare HDMI, som i 1.0.0 (hdmi0 = porten nærmest USB-C-strømmen):
#audio_output = hdmi
# DAC+-nivå i dB (0 = fullt, negativ = lavere)
#dacplus_volume_db = 0
# Fast buffer i stedet for automatisk (periode x antall), f.eks. 256x2, 512x2
#buffer = auto
#chime = on
#output_gain_db = 0

# Anslag (velocity): off = som originalen
#velocity = off
# 1 = Poly I (106), 2 = Poly II, 0 = Unison
#voice_mode = 1
#bender_dco = 0.25
#bender_vcf = 0.0
#mod_depth = 0.5
#master_volume = 0.5

# Kontroller (AKAI MPK Mini Plus)
# Anbefalt på MPK-en: tangenter kanal 1, pads kanal 10 i Note-modus,
# knotter absolute CC 70–77.
#key_channel = omni
#pad_channel = 10
#knob_cc = 70 71 72 73 74 75 76 77
# Egne pad-noter krever mapping_version = 2 på denne filen. Uten den linjen
# beholdes pad-notene fra 1.3.0, så et gammelt ju6.conf ikke stiller dem tilbake.
#mapping_version = 2
#pad_notes_a = 36 37 38 39 40 41 42 43
#pad_notes_b = 44 45 46 47 48 49 50 51
#mod_cc = 1
#knob_mode = absolute
#knob_takeover = jump
#save_hold_seconds = 1.5
# Pad-LED: on (standard), any eller off. Ikke verifisert på maskinvare.
#pad_leds = on
