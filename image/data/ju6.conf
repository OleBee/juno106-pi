# JU-6 Pi – dine innstillinger. Fjern # foran en linje for å bruke den.
# Fullstendig liste med forklaring: /etc/ju6pi/ju6.conf i imaget, og README i prosjektet.

# Lydutgang i prioritert rekkefølge (hdmi0 = porten nærmest USB-C-strømmen)
#audio_devices = hdmi0 hdmi1 usb
# Bare USB-lydkort:
#audio_devices = usb
# Fast buffer i stedet for automatisk (periode x antall), f.eks. 256x2, 512x2
#buffer = auto
#chime = on
#output_gain_db = 0

# Anslag (velocity): off = som originalen
#velocity = off
# 1 = Poly I (106), 2 = Poly II, 0 = Unison
#voice_mode = 1
#bender_dco = 0.25
#bender_vcf = 0.0
#mod_depth = 0.5
#master_volume = 0.5

# Kontroller (AKAI MPK Mini Plus fabrikkoppsett)
#key_channel = omni
#pad_channel = 10
#knob_cc = 70 71 72 73 74 75 76 77
#pad_notes_a = 36 37 38 39 40 41 42 43
#pad_notes_b = 44 45 46 47 48 49 50 51
#mod_cc = 1
#knob_mode = absolute
#knob_takeover = jump
#save_hold_seconds = 1.5
